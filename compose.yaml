services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: horarios
      POSTGRES_USER: horarios
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Cree un .env con POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U horarios -d horarios"]
      interval: 5s
      timeout: 5s
      retries: 12

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://horarios:${POSTGRES_PASSWORD}@db:5432/horarios
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:?Cree un .env con FLASK_SECRET_KEY}
    ports:
      - "${WEB_PORT:-5000}:5000"
    volumes:
      - uploads_data:/app/uploads

volumes:
  postgres_data:
  uploads_data:
